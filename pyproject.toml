[project]
name = "assorted-python-tools"
version = "0.1.0"
description = "Assorted small Python helpers for terminal output, input, and debugging."
requires-python = ">=3.13"
dependencies = [
    "english-words>=2.0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assorted_tools = ["data/*.json.gz"]
